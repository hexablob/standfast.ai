packages:
  - packages/*
  # The evaluation harness is deliberately not under packages/*. It links AGPL
  # packages, is never published, and no product package may depend on it —
  # keeping it out of the glob makes that structural rather than a convention.
  - eval

# pnpm 10 does not run dependency lifecycle scripts unless they are listed
# here. Keep this list short and deliberate — an unreviewed postinstall is
# the cheapest supply-chain foothold there is (docs/02-principles.md, 12).
onlyBuiltDependencies:
  - esbuild
